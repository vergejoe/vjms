[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vjms"
version = "0.1.0"
description = "VergeJoe Model Studio — train tiny bilingual language models from scratch, locally."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.5,<3",
  "numpy>=1.26,<3",
  "tokenizers>=0.20,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1",
  "psutil>=6,<8",
  "filelock>=3.16,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
vjms = "vjms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vjms = ["static/*", "samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
